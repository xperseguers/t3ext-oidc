services:
  composer-v13:
    build:
      context: typo3
      target: php-composer
    volumes:
      - ./typo3/typo3-v13:/app
      - ..:/app/packages/oidc
      - ./typo3/typo3/packages/oidc-sitepackage:/app/packages/oidc-sitepackage
    command: update -W

  composer-v14:
    build:
      context: typo3
      target: php-composer
    volumes:
      - ./typo3/typo3-v14:/app
      - ..:/app/packages/oidc
      - ./typo3/typo3/packages/oidc-sitepackage:/app/packages/oidc-sitepackage
    command: update -W
